name: me5418-group25-m2
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - pip
  - pip:
      # CPU PyTorch wheel; the 22k-parameter network does not need a GPU.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.13.0+cpu
      - highway-env==1.12.1
      - gymnasium==1.3.0
      - numpy==2.5.3
      - pygame-ce==2.5.8
      - matplotlib==3.11.1
      - Pillow==12.3.0
      - imageio==2.37.4
      - imageio-ffmpeg==0.6.0
      - pytest==9.1.1
